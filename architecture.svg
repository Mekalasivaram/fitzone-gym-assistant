<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="530" viewBox="0 0 1050 530" role="img" aria-labelledby="title desc">
<title id="title">FitZone Gym Sales Agent Architecture</title><desc id="desc">Implemented browser prototype and planned production services.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#39785a"/></marker><style>text{font-family:Arial,sans-serif;fill:#183629}.box{fill:#fff;stroke:#78a88b;stroke-width:2}.future{fill:#f4f7f5;stroke:#8c9c91;stroke-width:2;stroke-dasharray:7 5}.arr{stroke:#39785a;stroke-width:2.5;marker-end:url(#arrow)}.title{font-size:22px;font-weight:bold}.label{font-size:16px;font-weight:bold}.small{font-size:13px;fill:#53665a}</style></defs>
<rect width="1050" height="530" fill="#f7faf7"/><text x="35" y="40" class="title">FitZone Gym Sales Agent — Architecture</text><text x="35" y="72" class="label">CURRENT MVP (runs in one browser)</text>
<rect x="35" y="100" width="175" height="100" rx="13" class="box"/><text x="122" y="139" text-anchor="middle" class="label">Visitor</text><text x="122" y="164" text-anchor="middle" class="small">Text / optional speech</text>
<rect x="260" y="100" width="250" height="100" rx="13" class="box"/><text x="385" y="139" text-anchor="middle" class="label">Web page</text><text x="385" y="164" text-anchor="middle" class="small">Chat · visitor form · summary</text>
<rect x="560" y="100" width="220" height="100" rx="13" class="box"/><text x="670" y="139" text-anchor="middle" class="label">JavaScript rules</text><text x="670" y="164" text-anchor="middle" class="small">FAQ match · score · sentiment</text>
<rect x="830" y="100" width="185" height="100" rx="13" class="box"/><text x="922" y="139" text-anchor="middle" class="label">Local storage + export</text><text x="922" y="164" text-anchor="middle" class="small">Saved lead · ICS · CSV</text>
<line x1="210" y1="150" x2="252" y2="150" class="arr"/><line x1="510" y1="150" x2="552" y2="150" class="arr"/><line x1="780" y1="150" x2="822" y2="150" class="arr"/>
<text x="35" y="260" class="label">PROPOSED PRODUCTION EXTENSIONS (not implemented in this MVP)</text>
<rect x="35" y="290" width="210" height="115" rx="13" class="future"/><text x="140" y="332" text-anchor="middle" class="label">Speech + telephony</text><text x="140" y="358" text-anchor="middle" class="small">Streaming STT / TTS calls</text>
<rect x="280" y="290" width="210" height="115" rx="13" class="future"/><text x="385" y="332" text-anchor="middle" class="label">RAG + AI model</text><text x="385" y="358" text-anchor="middle" class="small">Grounded multilingual replies</text>
<rect x="525" y="290" width="210" height="115" rx="13" class="future"/><text x="630" y="332" text-anchor="middle" class="label">Secure app + database</text><text x="630" y="358" text-anchor="middle" class="small">Auth · encryption · lead records</text>
<rect x="770" y="290" width="245" height="115" rx="13" class="future"/><text x="892" y="332" text-anchor="middle" class="label">Calendar + CRM</text><text x="892" y="358" text-anchor="middle" class="small">Confirmed booking · follow-up</text>
<text x="35" y="455" class="small">Solid boxes are implemented locally. Dashed boxes are future services.</text><text x="35" y="480" class="small">Scale plan: load-balanced stateless app instances + managed database + queue + monitoring + autoscaling.</text></svg>
